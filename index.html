<style>
  :root{
    --nostr:#8e5cff; --solid:#2f6df6; --ok:#1aa86b; --warn:#e08600; --err:#e0392b;
    --bg:#f4f6fb; --card:#ffffff; --ink:#11161c; --ink-2:#5b6675; --ink-3:#9aa4b2;
    --border:#e4e8ef; --chip:#eef1f7; --shadow:0 1px 3px rgba(16,35,47,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',Roboto,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);
       -webkit-font-smoothing:antialiased;line-height:1.45;}
  a{color:var(--solid);text-decoration:none;} a:hover{text-decoration:underline;}
  code{background:var(--chip);padding:1px 6px;border-radius:6px;font-size:.9em;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .wrap{max-width:860px;margin:0 auto;padding:32px 18px 60px;}
  header{text-align:center;margin-bottom:26px;}
  header h1{font-size:2rem;font-weight:700;letter-spacing:-.5px;}
  header h1 .arr{background:linear-gradient(90deg,var(--nostr),var(--solid));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  header p{color:var(--ink-2);margin-top:6px;}

  .bridge{display:grid;grid-template-columns:1fr 120px 1fr;gap:0;align-items:stretch;}
  @media(max-width:680px){ .bridge{grid-template-columns:1fr;} .span{order:2;padding:10px 0!important;} }
  .node{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-height:210px;display:flex;flex-direction:column;}
  .node.nostr{border-top:4px solid var(--nostr);}
  .node.solid{border-top:4px solid var(--solid);}
  .node-h{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
  .node-h .ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;}
  .nostr .ico{background:var(--nostr);} .solid .ico{background:var(--solid);}
  .node-h b{font-size:1.1rem;} .node-h small{color:var(--ink-3);margin-left:auto;font-size:.78rem;}
  .node-b{flex:1;display:flex;flex-direction:column;gap:10px;}

  .span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 6px;position:relative;}
  .span .line{width:100%;height:3px;border-radius:3px;background:var(--border);position:relative;overflow:hidden;}
  .span .line.live{background:linear-gradient(90deg,var(--nostr),var(--solid));}
  .span .badge{font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--ink-2);white-space:nowrap;}
  .span .badge.ok{background:rgba(26,168,107,.14);color:var(--ok);}
  .span .badge.warn{background:rgba(224,134,0,.14);color:var(--warn);}

  .btn{padding:10px 14px;border-radius:10px;font-weight:600;font-size:.95rem;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;}
  .btn:hover{filter:brightness(1.06);} .btn:active{transform:translateY(1px);}
  .btn.nostr{background:var(--nostr);} .btn.solid{background:var(--solid);}
  .btn.ghost{background:var(--chip);color:var(--ink);} .btn.sm{padding:6px 10px;font-size:.85rem;}
  input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:.92rem;outline:none;background:#fff;color:var(--ink);}
  input[type=text]:focus{border-color:var(--solid);box-shadow:0 0 0 3px rgba(47,109,246,.12);}
  .or{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:.78rem;}
  .or::before,.or::after{content:'';flex:1;height:1px;background:var(--border);}

  .result{font-size:.9rem;border-radius:10px;padding:10px 12px;background:var(--chip);}
  .result.ok{background:rgba(26,168,107,.10);}
  .result.warn{background:rgba(224,134,0,.10);}
  .result.err{background:rgba(224,57,43,.10);}
  .result .k{color:var(--ink-3);font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;}
  .result .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.84rem;word-break:break-all;}
  .pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:20px;}
  .pill.ok{background:rgba(26,168,107,.16);color:var(--ok);}
  .pill.warn{background:rgba(224,134,0,.16);color:var(--warn);}
  .pill.err{background:rgba(224,57,43,.16);color:var(--err);}

  .coach{margin-top:22px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;}
  .coach h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:8px;}
  .coach .msg{font-size:.95rem;}
  .coach .steps{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .coach .step{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;}
  .coach .step .dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;background:var(--chip);color:var(--ink-2);font-size:.72rem;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:1px;}
  .coach .step.done .dot{background:var(--ok);color:#fff;}
  .coach .step.now .dot{background:var(--solid);color:#fff;}
  .coach .cmd{margin-top:10px;display:flex;align-items:center;gap:8px;background:#0f1722;color:#e6edf3;border-radius:9px;padding:9px 12px;font-family:ui-monospace,Menlo,monospace;font-size:.86rem;}
  .coach .cmd code{background:none;color:inherit;padding:0;flex:1;}

  .recent{margin-top:18px;}
  .recent h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:8px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:.84rem;display:flex;align-items:center;gap:7px;cursor:pointer;box-shadow:var(--shadow);}
  .chip:hover{border-color:var(--solid);}
  .chip .d{width:7px;height:7px;border-radius:50%;} .chip .d.ok{background:var(--ok);} .chip .d.warn{background:var(--warn);}
  .chip .x{color:var(--ink-3);font-weight:700;margin-left:2px;}

  footer{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;color:var(--ink-3);font-size:.82rem;}
  footer input{width:200px;padding:5px 9px;font-size:.82rem;}
  .muted{color:var(--ink-3);font-size:.85rem;}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Bridges <span class="arr">⚡⇄◆</span></h1>
    <p>Connect your <b style="color:var(--nostr)">Nostr</b> identity and your <b style="color:var(--solid)">Solid</b> storage — from both sides.</p>
  </header>

  <section class="bridge">
    <!-- NOSTR side -->
    <div class="node nostr">
      <div class="node-h"><span class="ico">⚡</span><b>Nostr</b><small>identity</small></div>
      <input type="text" id="nameInput" placeholder="your name (optional)" style="margin-bottom:8px" />
      <input type="text" id="storageInput" placeholder="your storage / pod URL (optional)" style="margin-bottom:10px" />
      <div class="node-b" id="nostrBody"></div>
    </div>

    <div class="span">
      <span class="badge" id="bridgeBadge">not connected</span>
      <div class="line" id="bridgeLine"></div>
    </div>

    <!-- SOLID side -->
    <div class="node solid">
      <div class="node-h"><span class="ico">◆</span><b>Solid</b><small>storage</small></div>
      <div class="node-b" id="solidBody"></div>
    </div>
  </section>

  <section class="coach" id="coach"></section>
  <section class="recent" id="recentSec" style="display:none"><h3>Recent</h3><div class="chips" id="chips"></div></section>

  <footer>
    <label>resolver <input type="text" id="resolverInput" /></label>
    <label>relays <input type="text" id="relaysInput" style="width:240px" /></label>
    <span>bridges v0.0.1</span><span>·</span>
    <a href="https://github.com/solid-apps" target="_blank">solid-apps</a>
  </footer>
</main>

<script>
const LS='bridges.v0';
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=h=>!h?'':h.length>16?h.slice(0,10)+'…'+h.slice(-6):h;
function podRoot(webId){ try{ const u=new URL(webId); return u.origin+'/'; }catch{ return null; } }

/* --- tiny bech32 npub → hex decoder --- */
const B32='qpzry9x8gf2tvdw0s3jn54khce6mua7l';
function npubToHex(s){
  s=s.trim().toLowerCase(); const p=s.lastIndexOf('1'); if(s.slice(0,p)!=='npub'||p<1) return null;
  const words=[]; for(const c of s.slice(p+1)){ const v=B32.indexOf(c); if(v<0)return null; words.push(v); }
  let acc=0,bits=0; const out=[];
  for(const w of words.slice(0,-6)){ acc=(acc<<5)|w; bits+=5; while(bits>=8){ bits-=8; out.push((acc>>bits)&0xff); } }
  if(out.length!==32) return null;
  return out.map(b=>b.toString(16).padStart(2,'0')).join('');
}
function bech32ToHex(s){
  s=s.trim().toLowerCase(); const p=s.lastIndexOf('1'); if(p<1) return null;
  const prefix=s.slice(0,p); const words=[]; for(const c of s.slice(p+1)){ const v=B32.indexOf(c); if(v<0)return null; words.push(v); }
  let acc=0,bits=0,out=[]; for(const w of words.slice(0,-6)){ acc=(acc<<5)|w; bits+=5; while(bits>=8){ bits-=8; out.push((acc>>bits)&0xff); } }
  if(out.length!==32) return null;
  return {prefix, hex: out.map(b=>b.toString(16).padStart(2,'0')).join('')};
}
function nsecToHex(s){ const d=bech32ToHex(s); return d&&d.prefix==='nsec'?d.hex:null; }
function toPubkey(input){
  input=input.trim();
  if(/^[0-9a-f]{64}$/i.test(input)) return input.toLowerCase();
  if(input.startsWith('npub')) return npubToHex(input);
  if(input.startsWith('did:nostr:')) return toPubkey(input.slice(10));
  return null;
}
/* hex-native: did:nostr uses 64-char hex; no bech32 nsec/npub encoding (npub decode above is only to tolerate pasted npubs) */

/* --- memory --- */
function mem(){ try{ return JSON.parse(localStorage.getItem(LS))||{}; }catch{ return {}; } }
function saveMem(m){ localStorage.setItem(LS, JSON.stringify(m)); }
function remember(entry){
  const m=mem(); m.recent=(m.recent||[]).filter(e=>e.pubkey!==entry.pubkey); m.recent.unshift(entry);
  m.recent=m.recent.slice(0,6); m.resolver=state.resolver; saveMem(m); renderRecent();
}

/* --- state --- */
// Use the served-from origin ONLY when it's a local pod (a real resolver); on public/static
// hosts (e.g. GitHub Pages) that origin is NOT a did:nostr resolver, so fall back to nostr.social.
const isLocalPod = location.protocol.startsWith('http') && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const defaultResolver = isLocalPod ? location.origin : 'https://nostr.social';
const DEFAULT_RELAYS = ['wss://relay.damus.io','wss://nos.lol','wss://relay.nostr.band'];
const defaultRelays = (isLocalPod ? [location.origin.replace(/^http/,'ws')+'/relay'] : []).concat(DEFAULT_RELAYS);
// storage often = the pod you're served from — but NOT on static hosts (github.io etc.)
const STATIC_HOSTS = /(?:^|\.)(?:github\.io|pages\.dev|netlify\.app|vercel\.app)$/i;
const servedFromPod = location.protocol.startsWith('http') && !STATIC_HOSTS.test(location.hostname);
// served from a pod → use that origin; on static hosts (github.io) fall back to a sensible default
const defaultStorage = (servedFromPod ? location.origin : 'http://localhost:5444') + '/profile/card.jsonld#me';
const state={ pubkey:null, doc:null, webId:null, pod:null, resolver: mem().resolver || defaultResolver, linkedKey:null, name:'', storage:'', relays:[], candidate:null, verified:false, unconfReason:'', webidKeys:[], solidInput:'' };

/* --- NOSTR → SOLID : find a candidate WebID, then VERIFY it actually lists this pubkey --- */
async function resolveStorage(pubkey){
  state.pubkey=pubkey; state.doc=null; state.webId=null; state.pod=null; state.candidate=null; state.verified=false;
  renderNostr('resolving'); renderBridge(); coach();
  const resolver=state.resolver.replace(/\/+$/,'');
  // 1. canonical did:nostr doc (best-effort)
  let doc=null;
  try{ const res=await fetch(`${resolver}/.well-known/did/nostr/${pubkey}.json`,{headers:{Accept:'application/json'}}); if(res.ok) doc=await res.json(); }catch{}
  state.doc=doc;
  // 2. candidate WebID/storage: alsoKnownAs → the key's kind-0 storage → (own key) the storage field
  let candidate = doc ? [].concat(doc.alsoKnownAs||[]).filter(Boolean)[0] : null;
  const fromResolver=!!candidate;
  if(!candidate){ const p=await queryKind0(pubkey).catch(()=>null); if(p) candidate=p.storage||p.website||null; }
  if(!candidate && mem().key && mem().key.pub===pubkey && state.storage) candidate=state.storage;
  if(!candidate){ renderNostr(doc?'nostorage':'noaccount'); renderBridge(); coach(); remember({pubkey,webId:null,pod:null,name:state.name||null,ts:Date.now()}); return; }
  state.candidate=candidate;
  // 3. VERIFY the backlink: fetch the WebID, check it actually lists this pubkey
  const v=await verifyWebId(candidate, pubkey);
  state.webidKeys = v.keys||[];
  const bridged = v.ok || (fromResolver && !v.readable);  // trust resolver's alsoKnownAs if the WebID isn't reachable from here
  if(bridged){ state.webId=candidate; state.pod=podRoot(candidate); state.verified=true; renderNostr('storage'); }
  else { state.unconfReason = (location.protocol==='https:'&&/^http:\/\//i.test(candidate))?'mixed':(v.readable?'nokey':'unreachable'); renderNostr('unconfirmed'); }
  renderBridge(); coach();
  remember({pubkey, webId:state.verified?candidate:null, pod:state.verified?state.pod:null, name:state.name||null, ts:Date.now()});
}
function keysInProfile(text){ return [...new Set([...String(text).toLowerCase().matchAll(/(?:fe70102|did:nostr:)([0-9a-f]{64})/g)].map(m=>m[1]))]; }  // fe70102 multibase + did:nostr forms
async function verifyWebId(webId, pubkey){
  try{
    const r=await fetch(webId,{headers:{Accept:'text/turtle, application/ld+json;q=0.9, */*;q=0.8'}});
    if(!r.ok) return {ok:false, readable:false, keys:[], reason:String(r.status)};
    const t=(await r.text()).toLowerCase();
    const keys=keysInProfile(t);
    const pk=pubkey.toLowerCase();
    return {ok: keys.includes(pk) || t.includes(pk), readable:true, keys};
  }catch(e){ return {ok:false, readable:false, keys:[], reason:e.message}; }
}
function queryKind0(pubkey){
  return new Promise(resolve=>{
    const relays=(state.relays&&state.relays.length)?state.relays:defaultRelays;
    let best=null, done=0, fin=false;
    const out=()=>{ if(fin)return; fin=true; let p=null; try{ p=best?JSON.parse(best.content):null; }catch{} resolve(p); };
    setTimeout(out, 6500);
    const subid='r'+Math.random().toString(36).slice(2,8);
    relays.forEach(url=>{
      let ws, settled=false;
      const one=()=>{ if(settled)return; settled=true; done++; if(done>=relays.length) out(); };
      const t=setTimeout(()=>{ try{ws&&ws.close();}catch{} one(); },6000);
      try{ ws=new WebSocket(url); }catch{ one(); return; }
      ws.onopen=()=>{ try{ ws.send(JSON.stringify(['REQ',subid,{authors:[pubkey],kinds:[0],limit:1}])); }catch{ one(); } };
      ws.onmessage=m=>{ try{ const d=JSON.parse(m.data);
        if(d[0]==='EVENT'&&d[1]===subid){ const ev=d[2]; if(ev&&(!best||ev.created_at>best.created_at)) best=ev; }
        else if(d[0]==='EOSE'&&d[1]===subid){ try{ws.send(JSON.stringify(['CLOSE',subid]));}catch{} try{ws.close();}catch{} clearTimeout(t); one(); }
      }catch{} };
      ws.onerror=()=>{ clearTimeout(t); try{ws.close();}catch{} one(); };
    });
  });
}
async function connectNostr(){
  if(!window.nostr){ renderNostr('nosigner'); coach(); return; }
  let pk; try{ pk=(await window.nostr.getPublicKey()).toLowerCase(); }
  catch(e){ renderNostr('error','Signer declined: '+e.message); coach(); return; }
  resolveStorage(pk);
}
function pasteNostr(){
  const pk=toPubkey($('nKeyInput').value||'');
  if(!pk){ const e=$('nKeyMsg'); if(e){ e.textContent='Not a valid public key — expected hex or npub…'; e.style.color='var(--err)'; } return; }
  resolveStorage(pk);
}

/* --- generate a brand-new key (newcomers) --- */
async function generateKey(){
  if(mem().key && mem().key.priv && !confirm('You already have a saved key. Replace it with a new one? Your current identity will be forgotten — back it up first.')) return;
  const b=$('nostrBody'); b.innerHTML='<div class="muted">Generating a fresh key…</div>';
  let secp;
  try{ const M=await import('https://esm.sh/@noble/secp256k1@1.7.1'); secp=M.schnorr?M:(M.default||M); }
  catch(e){ b.innerHTML='<div class="result err">Couldn’t load the crypto library: '+esc(e.message)+'</div>'+resetBtn(); return; }
  const priv=secp.utils.randomPrivateKey();
  const privHex=secp.utils.bytesToHex(priv);
  const pubHex=secp.utils.bytesToHex(secp.schnorr.getPublicKey(priv));
  const m=mem(); m.key={pub:pubHex, priv:privHex}; saveMem(m);  // local self-custody (guest key)
  showNewKey(pubHex, privHex);
}
function showNewKey(pubHex, privHex){
  $('nostrBody').innerHTML=`
    <div class="result warn"><b>⚠ Back this up now.</b> Your secret key is the <b>only</b> copy — no reset, no recovery. Anyone who has it controls your identity.</div>
    <div class="result"><div class="k">public key · 64-hex (your did:nostr)</div><div class="v">${esc(pubHex)}</div>
      <button class="btn ghost sm" onclick="copyText(this,'${pubHex}')" style="margin-top:6px">copy public</button></div>
    <div class="result"><div class="k">secret key · 64-hex (keep private)</div><div class="v">${esc(privHex)}</div>
      <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
        <button class="btn ghost sm" onclick="copyText(this,'${privHex}')">copy secret</button>
        <button class="btn ghost sm" onclick="downloadKey('${pubHex}','${privHex}')">download backup</button></div></div>
    <button class="btn nostr" onclick="resolveStorage('${pubHex}')" style="margin-top:auto">I’ve saved it — continue</button>
    <div class="muted">For real safety, keep your secret key in a signer (Alby, nos2x).</div>`;
}
function copyText(btn,txt){ navigator.clipboard?.writeText(txt); const t=btn.textContent; btn.textContent='copied ✓'; setTimeout(()=>btn.textContent=t,1200); }
function downloadKey(pub,priv){
  const body=`Nostr identity backup (64-char hex)\n\npublic key:  ${pub}\nsecret key:  ${priv}\n\nAnyone with the secret key controls this identity. There is no recovery — store it safely.`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([body],{type:'text/plain'})); a.download='nostr-key-backup.txt'; a.click();
}

/* --- sign in with an existing private key (64-hex or nsec) --- */
async function importKey(){
  const setMsg=(t,err)=>{ const e=$('nKeyMsg'); if(e){ e.textContent=t; e.style.color=err?'var(--err)':'var(--ink-3)'; } };
  let raw=(($('nSkInput')||{}).value||'').trim().replace(/^nostr:/i,'');
  if(!raw){ setMsg('Enter your private key (64-hex or nsec) to sign in.', true); return; }
  if(/^npub1/i.test(raw)){ setMsg('That’s a public key (npub). Paste it under “look up a public key”, or use your private nsec/hex here to sign in.', true); return; }
  let priv = /^[0-9a-f]{64}$/i.test(raw) ? raw.toLowerCase() : (/^nsec1/i.test(raw) ? nsecToHex(raw) : null);
  if(!priv){ setMsg('Not a valid private key — expected 64 hex characters or an nsec…', true); return; }
  if(mem().key && mem().key.priv && mem().key.priv!==priv && !confirm('Replace your current saved key with this one?')) return;
  $('nostrBody').innerHTML='<div class="muted">Signing in…</div>';
  let secp; try{ const M=await import('https://esm.sh/@noble/secp256k1@1.7.1'); secp=M.schnorr?M:(M.default||M); }
  catch(e){ $('nostrBody').innerHTML='<div class="result err">Couldn’t load the crypto library: '+esc(e.message)+'</div>'+resetBtn(); return; }
  let pub; try{ pub=secp.utils.bytesToHex(secp.schnorr.getPublicKey(priv)); }
  catch(e){ renderNostr('idle'); setMsg('That doesn’t look like a valid private key.', true); return; }
  const m=mem(); m.key={pub, priv}; saveMem(m);   // self-custody signing key
  resolveStorage(pub);
}

/* --- publish profile (kind 0) to relays --- */
function canSign(){ return !!((mem().key&&mem().key.priv)||(window.nostr&&window.nostr.signEvent)); }
function pubBtn(){ return canSign()?`<button class="btn nostr sm" onclick="publishProfile()" style="margin-top:8px">📡 Publish profile to relays</button><div class="muted" id="pubStatus"></div>`:''; }
function setPubStatus(t){ const e=$('pubStatus'); if(e) e.textContent=t; }
async function signEvent(evt){
  const k=mem().key;
  if(k&&k.priv){
    const M=await import('https://esm.sh/@noble/secp256k1@1.7.1'); const secp=M.schnorr?M:(M.default||M);
    evt.pubkey=k.pub;
    const serial=JSON.stringify([0,evt.pubkey,evt.created_at,evt.kind,evt.tags,evt.content]);
    const hash=new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(serial)));
    evt.id=secp.utils.bytesToHex(hash);
    evt.sig=secp.utils.bytesToHex(await secp.schnorr.sign(evt.id, k.priv));
    return evt;
  }
  if(window.nostr&&window.nostr.signEvent) return await window.nostr.signEvent(evt);
  throw new Error('no signer available');
}
async function publishProfile(){
  if(!state.pubkey) return;
  setPubStatus('Signing…');
  const content={}; if(state.name) content.name=state.name;
  const stor=state.storage||state.pod||''; if(stor){ content.storage=stor; content.website=stor; }
  let evt={kind:0, created_at:Math.floor(Date.now()/1000), tags:[], content:JSON.stringify(content), pubkey:state.pubkey};
  try{ evt=await signEvent(evt); }catch(e){ setPubStatus('Sign failed: '+e.message); return; }
  publishEvent(evt);
}
function publishEvent(evt){
  const relays=(state.relays&&state.relays.length)?state.relays:defaultRelays;
  let ok=0,done=0; setPubStatus('Publishing to '+relays.length+' relays…');
  relays.forEach(url=>{
    let ws, settled=false;
    const tally=good=>{ if(settled)return; settled=true; clearTimeout(t); if(good)ok++; done++; if(done>=relays.length) setPubStatus('Published to '+ok+'/'+relays.length+' relays'+(ok?' ✓':' — none accepted')); };
    const t=setTimeout(()=>{ try{ws&&ws.close();}catch{} tally(false); }, 6000);
    try{ ws=new WebSocket(url); }catch{ tally(false); return; }
    ws.onopen=()=>{ try{ ws.send(JSON.stringify(['EVENT',evt])); }catch{ tally(false); } };
    ws.onmessage=m=>{ try{ const d=JSON.parse(m.data); if(d[0]==='OK'&&d[1]===evt.id){ tally(!!d[2]); try{ws.close();}catch{} } }catch{} };
    ws.onerror=()=>{ tally(false); try{ws.close();}catch{} };
  });
}

/* --- fetch profile (kind 0) from relays — the read counterpart to publish --- */
function fetchBtn(){ return state.pubkey?`<button class="btn ghost sm" onclick="fetchProfile()" style="margin-top:8px">⤓ Fetch profile from relays</button><div class="muted" id="fetchStatus"></div>`:''; }
function setFetchStatus(t){ const e=$('fetchStatus'); if(e) e.innerHTML=t; }
function fetchProfile(){
  if(!state.pubkey) return;
  const relays=(state.relays&&state.relays.length)?state.relays:defaultRelays;
  setFetchStatus('Querying '+relays.length+' relays…');
  const subid='p'+Math.random().toString(36).slice(2,8);
  let best=null, done=0;
  const close=ws=>{ try{ ws&&ws.close(); }catch{} };
  relays.forEach(url=>{
    let ws, settled=false;
    const fin=()=>{ if(settled)return; settled=true; clearTimeout(t); done++; if(done>=relays.length) renderFetched(best); };
    const t=setTimeout(()=>{ close(ws); fin(); }, 6000);
    try{ ws=new WebSocket(url); }catch{ fin(); return; }
    ws.onopen=()=>{ try{ ws.send(JSON.stringify(['REQ',subid,{authors:[state.pubkey],kinds:[0],limit:1}])); }catch{ fin(); } };
    ws.onmessage=m=>{ try{ const d=JSON.parse(m.data);
      if(d[0]==='EVENT'&&d[1]===subid){ const ev=d[2]; if(ev&&(!best||ev.created_at>best.created_at)) best=ev; }
      else if(d[0]==='EOSE'&&d[1]===subid){ try{ws.send(JSON.stringify(['CLOSE',subid]));}catch{} close(ws); fin(); }
    }catch{} };
    ws.onerror=()=>{ close(ws); fin(); };
  });
}
function renderFetched(ev){
  if(!ev){ setFetchStatus('No profile found on relays for this key yet — publish one first.'); return; }
  let p={}; try{ p=JSON.parse(ev.content)||{}; }catch{}
  if(p.name && !state.name){ state.name=p.name; const m=mem(); m.name=p.name; saveMem(m); const ni=$('nameInput'); if(ni) ni.value=p.name; }
  const stor=p.storage||p.website||'';
  if(stor && !state.storage){ state.storage=stor; const m=mem(); m.storage=stor; saveMem(m); const si=$('storageInput'); if(si) si.value=stor; }
  const when=new Date(ev.created_at*1000).toLocaleString();
  setFetchStatus('Found on relays (updated '+esc(when)+'):<br>'+
    (p.picture?`<img src="${esc(p.picture)}" alt="" style="width:38px;height:38px;border-radius:50%;vertical-align:middle;margin:4px 8px 2px 0">`:'')+
    (p.name?`<b style="color:var(--ink)">${esc(p.name)}</b>`:'<i>(no name)</i>')+
    (p.nip05?` · ${esc(p.nip05)}`:'')+
    (p.about?`<div style="margin-top:2px">${esc(p.about)}</div>`:'')+
    (stor?`<div style="margin-top:2px">📦 storage: <a href="${esc(stor)}" target="_blank" rel="noopener">${esc(stor)}</a></div>`:''));
}

/* --- test pod login: a NIP-98 signed request, proving the pod recognizes your key --- */
function loginBtn(){ return (canSign()&&state.pod)?`<button class="btn solid sm" onclick="testLogin()" style="margin-top:8px">🔓 Test pod login (NIP-98)</button><div class="muted" id="loginStatus"></div>`:''; }
function setLoginStatus(t){ const e=$('loginStatus'); if(e) e.innerHTML=t; }
function wacUser(h){ const m=/user="([^"]*)"/i.exec(h||''); return m?m[1].trim():''; }
async function nip98Header(url, method){
  let evt={kind:27235, created_at:Math.floor(Date.now()/1000), tags:[['u',url],['method',method]], content:'', pubkey:state.pubkey};
  evt=await signEvent(evt);  // local schnorr or window.nostr
  return 'Nostr '+btoa(unescape(encodeURIComponent(JSON.stringify(evt))));
}
async function testLogin(){
  const target = state.pod || podRoot(state.webId) || (location.origin+'/');
  setLoginStatus('Signing a request to <code>'+esc(target)+'</code>…');
  let anon, authed, header;
  try{ anon=await fetch(target,{method:'GET'}); }catch(e){ setLoginStatus('<span style="color:var(--err)">Couldn’t reach the pod ('+esc(e.message)+') — run from the pod-served copy if it’s on http://localhost.</span>'); return; }
  try{ header=await nip98Header(target,'GET'); }catch(e){ setLoginStatus('<span style="color:var(--err)">Sign failed: '+esc(e.message)+'</span>'); return; }
  try{ authed=await fetch(target,{method:'GET',headers:{Authorization:header}}); }catch(e){ setLoginStatus('<span style="color:var(--err)">Request failed: '+esc(e.message)+'</span>'); return; }
  const a=wacUser(anon.headers.get('WAC-Allow')), b=wacUser(authed.headers.get('WAC-Allow'));
  const ok = b && b!==a;
  setLoginStatus(`HTTP <b>${authed.status}</b> · signed as <code>${esc((state.pubkey||'').slice(0,12))}…</code><br>anonymous perms: <code>${esc(a||'—')}</code><br>your perms: <code>${esc(b||'—')}</code> ${ok?'<span class="pill ok">logged in ✓</span>':'<span class="pill warn">no elevated access (check WAC-Allow / ACL)</span>'}`);
}

/* --- SSO: the magic redirect — key → resolver → WebID → land at your profile --- */
function gotoBtn(){ const t=state.webId||state.candidate; return t?`<button class="btn solid" onclick="gotoProfile()" style="margin-top:8px;width:100%">Go to my profile →</button>`:''; }
function gotoProfile(){ const t=state.webId||state.candidate; if(t) location.href=t; }

/* --- SOLID → NOSTR : find linked key --- */
async function findFromSolid(){
  const input=($('sInput').value||'').trim(); if(!input) return;
  state.linkedKey=null; renderSolid('finding');
  let url=input; if(!/^https?:/.test(url)) url='https://'+url;
  let text;
  try{ const r=await fetch(url,{headers:{Accept:'text/turtle, application/ld+json;q=0.9, */*;q=0.8'}}); if(!r.ok){ renderSolid('error',`${r.status} fetching profile`); return; } text=await r.text(); }
  catch(e){ renderSolid('error',e.message); return; }
  // find a nostr key in the profile: fe70102 multibase VM, did:nostr, or npub
  const keys=keysInProfile(text);
  const np=text.match(/\bnpub1[0-9a-z]{20,}\b/i);
  const hex = keys[0] || (np?npubToHex(np[0]):null);
  if(hex){ state.linkedKey=hex; renderSolid('found', url); coach(); if(!state.pubkey) resolveStorage(hex); }
  else { renderSolid('notlinked', url); coach(); }
}
function rememberSolidInput(v){ state.solidInput=(v||'').trim(); const m=mem(); m.solidInput=state.solidInput; saveMem(m); }

/* --- renderers --- */
function renderNostr(stage, detail){
  const b=$('nostrBody');
  if(stage==='idle'){ b.innerHTML=`
    <button class="btn nostr" onclick="connectNostr()">⚡ Sign in with extension</button>
    <div class="or">or with a private key</div>
    <input type="text" id="nSkInput" placeholder="private key — 64-hex or nsec…" onkeydown="if(event.key==='Enter')importKey()" />
    <button class="btn ghost sm" onclick="importKey()">Sign in</button>
    <div class="muted" id="nKeyMsg"></div>
    <div class="or">just look up a public key</div>
    <input type="text" id="nKeyInput" placeholder="public key — hex or npub…" onkeydown="if(event.key==='Enter')pasteNostr()" />
    <button class="btn ghost sm" onclick="pasteNostr()">Resolve</button>
    <div class="or">no key yet?</div>
    <button class="btn ghost" onclick="generateKey()">✨ Generate a new key</button>`; return; }
  const pk=state.pubkey;
  const nameRow=state.name?`<div class="result"><div class="k">name</div><div class="v">${esc(state.name)}</div></div>`:'';
  const head=nameRow+`<div class="result"><div class="k">pubkey</div><div class="v">${esc(short(pk))}</div></div>`;
  if(stage==='resolving'){ b.innerHTML=head+`<div class="muted">Resolving storage via ${esc(state.resolver)}…</div>`; return; }
  if(stage==='nosigner'){ b.innerHTML=`<div class="result err">No Nostr signer found. Install a NIP-07 extension (Alby, nos2x) or paste a key.</div>`+renderNostr.idleInputs(); return; }
  if(stage==='error'){ b.innerHTML=head+`<div class="result err">${esc(detail||'error')}</div>`+resetBtn(); return; }
  if(stage==='noaccount'){ b.innerHTML=head+`<div class="result warn"><b>Identity valid</b>, but no account at this resolver. Try another resolver, or add storage.</div>`+pubBtn()+fetchBtn()+resetBtn(); return; }
  if(stage==='nostorage'){ b.innerHTML=head+`<div class="result warn"><span class="pill warn">no storage</span> Identity resolves, but no <code>alsoKnownAs</code> pod is linked.</div>`+pubBtn()+fetchBtn()+resetBtn(); return; }
  if(stage==='storage'){ b.innerHTML=head+`<div class="result ok"><span class="pill ok">bridged</span> the WebID lists this key.</div>
    <div class="result"><div class="k">storage (webid)</div><div class="v"><a href="${esc(state.webId||state.pod)}" target="_blank">${esc(state.webId||state.pod)}</a></div></div>`+gotoBtn()+pubBtn()+fetchBtn()+loginBtn()+resetBtn(); return; }
  if(stage==='unconfirmed'){
    const hints={
      mixed:'This page is <b>https</b> but your storage is <b>http&#8203;://localhost</b> — browsers block that cross-origin. Open bridges from your pod (<code>http://localhost:5444/public/apps/bridges/</code>) to verify.',
      nokey:'That WebID is reachable but doesn’t list this key yet — add your key to the pod’s profile to finish the bridge.',
      unreachable:'Couldn’t read that WebID (blocked by the browser/extension, offline, or not public).'
    };
    const pk=(state.pubkey||'').toLowerCase();
    const keysBlock = state.unconfReason==='nokey'
      ? `<div class="result"><div class="k">your key</div><div class="v">${esc(pk)}</div></div>
         <div class="result"><div class="k">this WebID lists ${state.webidKeys.length} nostr key${state.webidKeys.length===1?'':'s'}</div>`
         + (state.webidKeys.length ? state.webidKeys.map(k=>`<div class="v">${esc(k)}${k===pk?' <span class="pill ok">← this is you</span>':''}</div>`).join('') : `<div class="v" style="color:var(--ink-3)">— none —</div>`)
         + `</div>`
      : '';
    b.innerHTML=head+`<div class="result warn"><span class="pill warn">unconfirmed</span> ${hints[state.unconfReason]||'Storage advertised, but not verified.'}</div>
    <div class="result"><div class="k">advertised storage</div><div class="v"><a href="${esc(state.candidate)}" target="_blank">${esc(state.candidate)}</a></div></div>`+keysBlock+gotoBtn()+pubBtn()+fetchBtn()+resetBtn(); return; }
}
renderNostr.idleInputs=()=>`<input type="text" id="nKeyInput" placeholder="hex pubkey (or npub)" /><button class="btn ghost sm" onclick="pasteNostr()">Resolve</button><div class="muted" id="nKeyMsg"></div>`;
function resetBtn(){
  const stored = mem().key && mem().key.pub===state.pubkey;
  return stored
    ? `<button class="btn ghost sm" onclick="forgetKey()" style="margin-top:auto">forget this key</button>`
    : `<button class="btn ghost sm" onclick="nostrReset()" style="margin-top:auto">↺ back</button>`;
}
function nostrReset(){ const k=mem().key; if(k&&k.pub){ state.pubkey=k.pub; resolveStorage(k.pub); } else { state.pubkey=null; state.doc=null; state.webId=null; state.pod=null; renderNostr('idle'); renderBridge(); coach(); } }
function forgetKey(){
  if(!confirm('Forget your saved key? There is no recovery — make sure you have a backup first.')) return;
  const m=mem(); delete m.key; saveMem(m);
  state.pubkey=null; state.doc=null; state.webId=null; state.pod=null;
  renderNostr('idle'); renderBridge(); coach();
}

function renderSolid(stage, url){
  const b=$('solidBody');
  if(stage==='idle'){ b.innerHTML=`
    <input type="text" id="sInput" placeholder="your WebID or pod URL" value="${esc(state.solidInput||state.storage||defaultStorage||'')}" oninput="rememberSolidInput(this.value)" onkeydown="if(event.key==='Enter')findFromSolid()" />
    <button class="btn solid sm" onclick="findFromSolid()">Find linked Nostr key</button>
    <div class="muted">Have a pod but no key linked? This finds it from the other side.</div>
    <div class="or">no pod yet?</div>
    <a class="btn solid" href="https://solidweb.app/" target="_blank" rel="noopener" style="margin-top:auto;text-decoration:none">Get a Solid pod →</a>`; return; }
  if(stage==='finding'){ b.innerHTML=`<div class="muted">Reading profile…</div>`; return; }
  if(stage==='error'){ b.innerHTML=`<div class="result err">${esc(url||'error')}</div>`+solidReset(); return; }
  if(stage==='found'){ b.innerHTML=`<div class="result"><div class="k">profile</div><div class="v">${esc(url)}</div></div>
    <div class="result ok"><span class="pill ok">linked key</span><div class="v">${esc(short(state.linkedKey))}</div></div>`+solidReset(); return; }
  if(stage==='notlinked'){ b.innerHTML=`<div class="result"><div class="k">profile</div><div class="v">${esc(url)}</div></div>
    <div class="result warn"><span class="pill warn">no key</span> No did:nostr / npub found in this profile.</div>`+solidReset(); return; }
}
function solidReset(){ return `<button class="btn ghost sm" onclick="renderSolid('idle')" style="margin-top:auto">↺ start over</button>`; }

function renderBridge(){
  const line=$('bridgeLine'), badge=$('bridgeBadge');
  const linked = state.pubkey && state.pod;
  line.className='line'+(linked?' live':'');
  if(linked){ badge.className='badge ok'; badge.textContent='✓ bridged'; }
  else if(state.pubkey){ badge.className='badge warn'; badge.textContent='needs storage'; }
  else { badge.className='badge'; badge.textContent='not connected'; }
}

/* --- coaching --- */
function coach(){
  const c=$('coach');
  const haveKey=!!state.pubkey, haveStorage=!!state.pod;
  const step=(n,label,st)=>`<div class="step ${st}"><span class="dot">${st==='done'?'✓':n}</span><div>${label}</div></div>`;
  const hi=state.name?`Hi ${esc(state.name)}! `:'';
  let msg, s1='now',s2='',s3='';
  if(!haveKey){ msg=hi+'Start by signing in with your Nostr key, pasting a hex key, or generating a fresh one. We’ll look up whether it already has Solid storage.'; }
  else if(haveStorage){ msg=hi+'🎉 <b>Bridged.</b> The WebID lists your key, so apps can resolve your storage from your key alone.'; s1='done';s2='done';s3='done'; }
  else if(state.candidate){ msg='Your profile advertises storage at <code>'+esc(state.candidate)+'</code>, but that WebID doesn’t list this key yet — the bridge isn’t confirmed. Add your key to the pod’s profile (a <code>verificationMethod</code>), or check from a context that can reach the pod.'; s1='done';s2='now'; }
  else { msg='Your Nostr identity resolves, but <b>no storage is linked yet</b>. Add a pod, point your profile at it, and add your key to the pod’s WebID.'; s1='done';s2='now'; }
  let cmd='';
  if(haveKey && !haveStorage){ cmd=`
    <div class="muted" style="margin:10px 0 6px">Get a pod — recommended: <a href="https://solidweb.app/idp/register" target="_blank"><b>solidweb.app</b></a> (free hosted, ~1&nbsp;min). Or self-host:</div>
    <div class="cmd"><code>npx jspod</code><button class="btn ghost sm" onclick="copyCmd(this,'npx jspod')">copy</button></div>
    <div class="muted" style="margin-top:8px">Linked a pod already? <button class="btn ghost sm" onclick="resolveStorage(state.pubkey)">re-check</button></div>`; }
  c.innerHTML=`<h3>Guide</h3><div class="msg">${msg}</div>
    <div class="steps">
      ${step(1,'Sign in with your Nostr key',s1)}
      ${step(2,'Find or add your Solid storage',s2)}
      ${step(3,'Linked — your key points to your pod',haveStorage?'done':'')}
    </div>${cmd}`;
}
function copyCmd(btn,txt){ navigator.clipboard?.writeText(txt); const t=btn.textContent; btn.textContent='copied'; setTimeout(()=>btn.textContent=t,1200); }

/* --- recent --- */
function renderRecent(){
  const m=mem(); const r=m.recent||[];
  if(!r.length){ $('recentSec').style.display='none'; return; }
  $('recentSec').style.display='';
  $('chips').innerHTML=r.map(e=>`<span class="chip" onclick="resolveStorage('${e.pubkey}')">
    <span class="d ${e.pod?'ok':'warn'}"></span>${esc(e.name||short(e.pubkey))}<span class="x" onclick="event.stopPropagation();forget('${e.pubkey}')">×</span></span>`).join('');
}
function forget(pk){ const m=mem(); m.recent=(m.recent||[]).filter(e=>e.pubkey!==pk); saveMem(m); renderRecent(); }

/* --- init --- */
window.connectNostr=connectNostr; window.pasteNostr=pasteNostr; window.findFromSolid=findFromSolid;
window.renderNostr=renderNostr; window.renderBridge=renderBridge; window.resolveStorage=resolveStorage;
window.renderSolid=renderSolid; window.copyCmd=copyCmd; window.forget=forget;
window.generateKey=generateKey; window.copyText=copyText; window.downloadKey=downloadKey;
window.forgetKey=forgetKey; window.nostrReset=nostrReset; window.state=state; window.mem=mem;
window.publishProfile=publishProfile; window.fetchProfile=fetchProfile; window.importKey=importKey; window.testLogin=testLogin; window.gotoProfile=gotoProfile; window.rememberSolidInput=rememberSolidInput;
$('resolverInput').value=state.resolver;
$('resolverInput').onchange=e=>{ state.resolver=e.target.value.trim()||defaultResolver; const m=mem();m.resolver=state.resolver;saveMem(m); };
state.relays=(mem().relays&&mem().relays.length)?mem().relays:defaultRelays;
$('relaysInput').value=state.relays.join(' ');
$('relaysInput').onchange=e=>{ state.relays=e.target.value.split(/[\s,]+/).filter(Boolean); const m=mem(); m.relays=state.relays; saveMem(m); };
/* name: from ?name= query string, else remembered */
const qsName=new URLSearchParams(location.search).get('name');
state.name=(qsName||mem().name||'').trim();
if(qsName){ const m=mem(); m.name=state.name; saveMem(m); }
$('nameInput').value=state.name;
$('nameInput').oninput=e=>{ state.name=e.target.value.trim(); const m=mem(); m.name=state.name; saveMem(m); coach(); };
const qsStorage=new URLSearchParams(location.search).get('storage');
state.storage=(qsStorage||mem().storage||defaultStorage||'').trim();
if(qsStorage){ const m=mem(); m.storage=state.storage; saveMem(m); }
$('storageInput').value=state.storage;
$('storageInput').oninput=e=>{ state.storage=e.target.value.trim(); const m=mem(); m.storage=state.storage; saveMem(m); };
state.solidInput=(new URLSearchParams(location.search).get('webid')||mem().solidInput||'').trim();
/* reuse the saved key if there is one (one bespoke key, kept until "forget") */
if(mem().key && mem().key.pub){ state.pubkey=mem().key.pub; resolveStorage(state.pubkey); } else { renderNostr('idle'); }
renderSolid('idle'); renderBridge(); coach(); renderRecent();
</script>
